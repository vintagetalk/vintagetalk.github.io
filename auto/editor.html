<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>디자인 편집기 · 빈티지 작업실</title>
<!-- 빈티지톡 디자인 편집기(11/23 빈티지 작업실로 옮김 — 예전 '메인 편집기 (웹)' 구글 웹앱을 대신함).
     쇼핑몰 화면 글·웹 저장은 빈티지 작업실 웹앱(아래 API)이 맡고, 편집기 코드는 빈티지톡 대표(스킨67)에 올라간 vt_hero.js 를 그대로 씀.
     원본: 클로드AI\카페24_자동화\auto_page\editor.html — 고치는 곳은 빈티지톡 편집기 세션 -->
<style>
html,body{margin:0;height:100%;font:14px "Noto Sans KR","Malgun Gothic",sans-serif;background:#222}
#bar{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#111;color:#fff;z-index:2;box-sizing:border-box}
#bar b{font-size:15px;margin-right:6px;white-space:nowrap}
#bar button{font:inherit;cursor:pointer;border:1px solid #444;background:#222;color:#fff;border-radius:6px;padding:6px 10px;white-space:nowrap}
#bar button.on{background:#c4001f;border-color:#c4001f}
#bar button:focus-visible{outline:2px solid #ffc83d;outline-offset:2px}
#bar .sp{flex:1}
#st{color:#bbb;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#stage{position:fixed;left:0;right:0;top:46px;bottom:0;width:100%;height:calc(100% - 46px);border:0;background:#fff}
#hello{position:fixed;inset:46px 0 0 0;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:16px;text-align:center;line-height:1.8;padding:0 20px}
@media (max-width:600px){#st{display:none}}
</style>
</head>
<body>
<div id="bar">
  <b>빈티지톡 디자인 편집기</b>
  <span id="st" role="status">불러오는 중…</span>
  <span class="sp"></span>
  <button id="bLive" type="button" title="웹 저장본은 두고, 지금 손님 화면 상태로 다시 불러오기">손님 화면 상태로 다시</button>
  <button id="bPub" type="button" class="on" title="카페24 관리자 로그인이 된 브라우저에서 쇼핑몰 창을 열어 웹 저장본을 손님 화면에 저장">쇼핑몰에 반영</button>
</div>
<div id="hello">빈티지톡 편집기를 여는 중이에요.<br>고친 것은 오른쪽 아래 "웹에 저장"으로 저장되고, 다른 컴퓨터에서도 이어서 고칠 수 있어요.</div>
<iframe id="stage" title="편집 화면" style="display:none"></iframe>
<script>
(function () {
  var API = 'https:' + '//script.google.com/macros/s/AKfycby66qcbuyVKL0YjL21isQXYAe1yDkkSvnC5s59N7GGKDnTcVqIcs2xHwIenG7NlDbydPg/exec';   // 빈티지 작업실 웹앱
  var SHOP = 'oldmarket';
  var info = null, stage = document.getElementById('stage'), st = document.getElementById('st');
  function say(t) { st.textContent = t; }
  function get(q) { return fetch(API + '?' + q + '&t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (o) { if (o && o.err) { throw new Error(o.err); } return o; }); }
  function post(o) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o) }).then(function (r) { return r.json(); }); }
  function esc(s) { return String(s).replace(/</g, '\\u003c'); }
  function setCfg(html, id, obj) {
    var re = new RegExp('(<script type="application/json" id="' + id + '">)([\\s\\S]*?)(</' + 'script>)');
    return html.replace(re, function (m, a, b, c) { return a + JSON.stringify(obj).replace(/</g, '\\u003c') + c; });
  }
  function build(useDraft) {
    var h = info.html, d = info.draft || {};
    if (useDraft && d.pc && d.mobile) { h = setCfg(h, 'vth-cfg', d.pc); h = setCfg(h, 'vth-cfg-m', d.mobile); if (d.hdr) { h = setCfg(h, 'vth-hdr-cfg', d.hdr); } }
    /* 손님 화면 스크립트는 빼고(설정 JSON만 남김), 그림·글꼴 주소는 쇼핑몰 주소 기준 */
    h = h.replace(/<script\b(?![^>]*application\/json)[^>]*>[\s\S]*?<\/script>/gi, '');
    h = h.replace(/<html([^>]*)>/i, '<html$1 class="vth-fok">');
    var page = h.replace(/<head([^>]*)>/i, '<head$1><base href="' + info.base + '/">');
    var boot = '<script>window.__VTH_WEB={shop:' + JSON.stringify(SHOP) + ',html:' + esc(JSON.stringify(page)) + '};</' + 'script>' +
      '<script src="' + info.editor + '"></' + 'script>';
    stage.srcdoc = page.replace(/<\/body>/i, boot + '</body>');
    stage.style.display = 'block'; document.getElementById('hello').style.display = 'none';
  }
  function load(useDraft) {
    say('불러오는 중…');
    get('api=ed_page&shop=' + SHOP).then(function (r) {
      info = r; var d = r.draft || {};
      build(useDraft !== false);
      say(r.name + ' — ' + (useDraft !== false && d.pc ? '웹 저장본(' + String(d.savedAt || '').replace('T', ' ').slice(0, 16) + ')으로 열었어요' : '지금 손님 화면 상태로 열었어요'));
    }).catch(function (e) { say('불러오기 실패: ' + (e && e.message || e)); document.getElementById('hello').textContent = '편집기를 불러오지 못했어요. 잠시 뒤 새로 고침해 주세요. (' + (e && e.message || e) + ')'; });
  }
  document.getElementById('bLive').onclick = function () { load(false); };
  document.getElementById('bPub').onclick = function () {
    if (!info) { say('아직 불러오는 중이에요'); return; }
    if (!(info.draft && info.draft.pc)) { say('웹에 저장된 것이 없어요. 오른쪽 아래 "웹에 저장"부터 눌러 주세요.'); return; }
    window.open(info.base + '/?vtedit&vtdraft=web', '_blank');
    say('새 탭에서 쇼핑몰 창이 웹 저장본을 불러와요. 확인하고 "카페24에 바로 저장"을 누르면 반영돼요(카페24 관리자 로그인 필요).');
  };
  window.addEventListener('message', function (e) {
    if (e.source !== stage.contentWindow) { return; }
    var d = e.data || {};
    var back = function (o) { try { stage.contentWindow.postMessage(o, '*'); } catch (x) { } };
    /* 가운데 화면: 편집기가 쇼핑몰의 다른 화면 글을 달라고 하면 받아서 돌려줌 */
    if (d.vth === 'page') {
      get('api=ed_path&shop=' + SHOP + '&path=' + encodeURIComponent(String(d.path || '/')))
        .then(function (r) { back({ vth: 'pageHtml', id: d.id, html: r && r.html, path: r && r.path }); })
        .catch(function (er) { back({ vth: 'pageHtml', id: d.id, err: String(er && er.message || er), path: d.path }); });
      return;
    }
    if (d.vth !== 'save') { return; }
    post({ api: 'ed_save', shop: d.shop || SHOP, data: d.data }).then(function (r) {
      if (!r || !r.ok) { throw new Error(r && r.err || '저장 실패'); }
      if (info) { info.draft = JSON.parse(d.data); info.draft.savedAt = r.at; }
      back({ vth: 'saved', ok: true, at: String(r.at).replace('T', ' ') }); say('웹에 저장함 ' + String(r.at).replace('T', ' '));
    }).catch(function (er) { back({ vth: 'saved', ok: false, err: String(er && er.message || er) }); say('웹 저장 실패: ' + (er && er.message || er)); });
  });
  load(true);
})();
</script>
</body>
</html>
