<title>사진 밝기 조절</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%232E2E2E'/%3E%3Cpath d='M32 12a20 20 0 0 1 0 40z' fill='%23FFC83D'/%3E%3Cpath d='M32 12a20 20 0 0 0 0 40z' fill='%23626262'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23F3F3F3' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --canvas:#242424;--bar:#303030;--line:#424242;--track:#4b4b4b;--text:#f3f3f3;--sub:#a9a9a9;
  --accent:#ffc83d;--ink:#1c1c1c;--zero:#8c8c8c;--danger:#ff8a7a;
  --ui:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --num:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
body{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit}
.btn{background:#3b3b3b;border:1px solid #575757;color:var(--text);border-radius:7px;padding:8px 16px;font-size:14px;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{background:#474747;border-color:#6a6a6a}
.btn:active,.btn.held{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700;padding:10px 22px;font-size:15px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--sub);padding:8px 10px}
.btn.quiet:hover{color:var(--text)}

/* 위: 조절선 */
#top{background:var(--bar);border-bottom:1px solid var(--line);padding:12px 18px 12px 14px;display:grid;grid-template-columns:2.1fr 1fr 1fr auto;column-gap:26px;align-items:end;position:relative;z-index:2}
.tone{display:grid;grid-template-columns:1fr auto;align-items:end;min-width:0}
.tone label{font-weight:700;font-size:16px;padding:0 0 2px 10px;white-space:nowrap}
.tone.big label{font-size:20px;padding:0 0 3px 12px}
.tone input.num{font-family:var(--num);font-weight:600;font-size:23px;line-height:1.1;width:3.1em;text-align:right;background:transparent;border:0;color:var(--text);padding:0 2px;margin:0 8px 0 8px;outline:none;border-radius:4px;caret-color:var(--accent)}
.tone.big input.num{font-size:32px;color:var(--accent);margin-right:10px}
.tone input.num:focus{background:#262626;box-shadow:0 0 0 2px var(--accent)}
.rw{grid-column:1/3;position:relative;--th:7px;--tw:21px}
.tone.big .rw{--th:10px;--tw:26px}
.rw::before{content:"";position:absolute;top:50%;height:calc(var(--th) + 12px);width:2px;transform:translateY(-50%);background:var(--zero);left:calc(var(--tw)/2 + (100% - var(--tw)) * var(--zt,0.5) - 1px);pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:38px;margin:0;background:transparent;cursor:pointer;position:relative;z-index:1;touch-action:none}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:var(--th);border-radius:999px;background:var(--fill,var(--track))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--tw);height:var(--tw);border-radius:50%;background:#fff;border:2.5px solid var(--ink);margin-top:calc((var(--th) - var(--tw)) / 2)}
input[type=range]::-moz-range-track{height:var(--th);border-radius:999px;background:var(--fill,var(--track))}
input[type=range]::-moz-range-thumb{width:var(--tw);height:var(--tw);border-radius:50%;background:#fff;border:2.5px solid var(--ink);box-sizing:border-box}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent)}
.tbtns{display:flex;gap:8px;align-items:center;padding-bottom:3px}

/* 가운데: 사진 */
#area{position:relative;overflow:hidden;background:var(--canvas);touch-action:none;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#area.pan{cursor:grab}
#area.panning{cursor:grabbing}
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:1}
body.has #empty{display:none}
#empty .box{width:min(600px,100%);min-height:320px;border:2px dashed var(--zero);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px}
#empty h1{font-size:26px;margin:0;font-weight:700;line-height:1.3}
#empty .sub{color:var(--sub);font-size:15px;line-height:24px;margin:12px 0 26px}
#empty .hint{color:var(--zero);font-size:13px;line-height:20px;margin:22px 0 0}
#empty .hint+.hint{margin-top:6px}
#badge{position:absolute;top:16px;left:16px;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;padding:5px 12px 6px;border-radius:6px;display:none;pointer-events:none;z-index:3}
body.orig.has #badge{display:block}
#status{position:absolute;left:16px;bottom:12px;color:var(--sub);font-size:13px;pointer-events:none;z-index:3}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(26,26,26,.86);border-radius:10px;padding:18px 26px;text-align:center;max-width:min(520px,90%);font-size:15px;line-height:23px;white-space:pre-line;display:none;pointer-events:none;z-index:4}
#msg.on{display:block}
#drop{position:absolute;inset:0;background:rgba(24,24,24,.69);display:none;place-items:center;z-index:5;pointer-events:none}
#drop.on{display:grid}
#drop .dash{position:absolute;inset:18px;border:3px dashed var(--accent);border-radius:18px}
#drop span{font-size:30px;font-weight:700;color:var(--accent)}

/* 아래: 사진 목록 */
#bottom{background:var(--bar);border-top:1px solid var(--line);padding:8px 12px 8px 10px;display:none;align-items:center;gap:14px;min-width:0}
body.has #bottom{display:flex}
#strip{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
#strip::-webkit-scrollbar{display:none}
body.single #strip{visibility:hidden}
.th{flex:none;width:86px;height:64px;border:2px solid transparent;border-radius:5px;background:var(--canvas);padding:2px;cursor:pointer;position:relative}
.th.cur{border-color:var(--accent)}
.th canvas{width:100%;height:100%;display:block}
.th.bad::after{content:"!";position:absolute;inset:0;display:grid;place-items:center;color:var(--danger);font-weight:700;font-size:22px}
#info{min-width:150px;max-width:320px}
#name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{color:var(--sub);font-size:13px;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
#tools{display:flex;gap:8px;align-items:center}
#zoom{min-width:76px}

@media (max-width:760px){
  #top{grid-template-columns:1fr 1fr;column-gap:14px;row-gap:0;padding:8px 10px 6px}
  #tB{grid-column:1/3}
  .tbtns{grid-column:1/3;justify-content:flex-end;padding:2px 0 0}
  .tone.big input.num{font-size:26px}
  .tone input.num{font-size:19px;width:2.8em}
  .tone label{font-size:15px}
  .tone.big label{font-size:17px}
  #bottom{flex-wrap:wrap;gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  #strip{flex-basis:100%}
  body.single #strip{display:none}
  #info{flex:1;min-width:0;max-width:none}
  .th{width:64px;height:48px}
  #empty h1{font-size:22px}
  .btn{padding:8px 12px}
  #tools{gap:6px}
  #clear .long{display:none}
}
</style>
</head>
<body>
<header id="top">
  <div class="tone big" id="tB"><label for="rB">명도</label><input class="num" id="nB" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="명도 숫자"><div class="rw"><input type="range" id="rB" title="포토샵 「명도/대비」의 명도와 같은 계산입니다. 두 번 누르면 150으로 돌아갑니다."></div></div>
  <div class="tone" id="tC"><label for="rC">대비</label><input class="num" id="nC" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="대비 숫자"><div class="rw"><input type="range" id="rC" title="포토샵 「명도/대비」의 대비와 같은 계산입니다. 두 번 누르면 100으로 돌아갑니다."></div></div>
  <div class="tone" id="tL"><label for="rL">밝기</label><input class="num" id="nL" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="밝기 숫자"><div class="rw"><input type="range" id="rL" title="포토샵 「색조/채도」의 밝기와 같은 계산입니다. 두 번 누르면 0으로 돌아갑니다."></div></div>
  <div class="tbtns">
    <button class="btn" id="orig" title="누르고 있는 동안 고치기 전 사진을 보여 줍니다. 스페이스바를 누르고 있어도 됩니다.">원본 보기</button>
    <button class="btn" id="reset" title="명도 150, 대비 100, 밝기 0으로 되돌립니다.">처음 값</button>
  </div>
</header>
<main id="area">
  <canvas id="view"></canvas>
  <div id="empty"><div class="box">
    <h1 id="etitle">사진을 여기에 끌어다 놓으세요</h1>
    <p class="sub" id="esub"></p>
    <button class="btn primary" id="pickBtn">사진 고르기</button>
    <p class="hint" id="ehint">← → 키로 다음 사진, 스페이스바를 누르고 있으면 원본, 마우스 휠로 확대</p>
    <p class="hint">사진은 인터넷에 올라가지 않고 이 기기 안에서만 처리됩니다.</p>
  </div></div>
  <div id="badge">원본</div>
  <div id="status"></div>
  <div id="msg"></div>
  <div id="drop"><div class="dash"></div><span>여기에 놓으세요</span></div>
</main>
<footer id="bottom">
  <div id="strip"></div>
  <div id="info"><div id="name"></div><div id="count"></div></div>
  <div id="tools">
    <button class="btn" id="zoom" title="맞춤 화면과 100%를 오갑니다. 사진을 두 번 눌러도 되고, 마우스 휠로 확대합니다.">맞춤</button>
    <button class="btn" id="add" title="사진을 골라 목록에 더합니다.">사진 추가</button>
    <button class="btn quiet" id="clear" title="목록만 비웁니다. 사진 파일은 그대로 있습니다."><span class="long">목록 </span>비우기</button>
  </div>
</footer>
<input type="file" id="pick" accept="image/*,.jpg,.jpeg,.png,.bmp,.gif,.webp,.heic,.tif,.tiff" multiple hidden>

      if (!it) break;
      it.thumbDone = true;
      const box = it.el.getBoundingClientRect(), d = dpr();
      const W = Math.max(40, Math.round((box.width - 8) * d)), H = Math.max(30, Math.round((box.height - 8) * d));
      try {
        let bmp;
        try { bmp = await createImageBitmap(it.file, { resizeHeight: H * 2, resizeQuality: 'medium', imageOrientation: 'from-image' }); }
        catch (e) { bmp = await createImageBitmap(it.file); }
        it.cv.width = W; it.cv.height = H;
        const s = Math.min(W / bmp.width, H / bmp.height), w = bmp.width * s, h = bmp.height * s;
        const x = it.cv.getContext('2d'); x.imageSmoothingQuality = 'high';
        x.drawImage(bmp, (W - w) / 2, (H - h) / 2, w, h);
        bmp.close();
      } catch (e) { it.bad = true; it.el.classList.add('bad'); }
      await new Promise(r => setTimeout(r, 0));
    }
  } finally { thumbBusy = false; }
}

function friendly(it) {
  if (/\.(heic|heif)$/i.test(it.name)) return '아이폰 사진 형식(HEIC)은 브라우저에서 열리지 않습니다.\n아이폰 설정 > 카메라 > 포맷 > 「높은 호환성」으로 찍거나 JPG로 바꿔 주세요.';
  if (/\.tiff?$/i.test(it.name)) return 'TIF 사진은 브라우저에서 열리지 않습니다. JPG로 바꿔 넣거나 PC 프로그램을 써 주세요.';
  return '깨진 파일이거나 사진이 아닙니다.';
}
function info() {
  if (app.cur < 0 || !app.items[app.cur]) { nameEl.textContent = ''; countEl.textContent = ''; zoomBtn.textContent = '맞춤'; return; }
  const it = app.items[app.cur];
  nameEl.textContent = it.name; nameEl.title = it.name;
  let c = (app.cur + 1) + ' / ' + app.items.length;
  if (app.img && app.img.it === it) c += ' ' + app.img.w + ' × ' + app.img.h + (app.img.scaledDown ? ' (이 기기에 맞게 줄임)' : '');
  countEl.textContent = c;
  zoomBtn.textContent = !app.img || app.fit ? '맞춤' : Math.round(app.scale * 100) + '%';
}
function highlight() {
  app.items.forEach((it, i) => it.el.classList.toggle('cur', i === app.cur));
  const it = app.items[app.cur];
  if (it) it.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
async function select(i) {
  if (i < 0 || i >= app.items.length) return;
  app.cur = i;
  const tok = ++app.token, it = app.items[i];
  highlight(); info();
  const slow = setTimeout(() => { if (tok === app.token) showMsg('불러오는 중…'); }, 180);
  let bmp;
  try { bmp = await getBitmap(it); }
  catch (e) {
    clearTimeout(slow);
    if (tok !== app.token) return;
    it.bad = true; it.el.classList.add('bad');
    R.clear(); app.img = null; scheduleDraw();
    showMsg('이 사진을 열 수 없습니다.\n' + it.name + '\n' + friendly(it));
    info();
    return;
  }
  clearTimeout(slow);
  if (tok !== app.token) return;
  try { R.setImage(bmp); }
  catch (e) { R.clear(); app.img = null; scheduleDraw(); showMsg('사진이 너무 커서 이 기기에서 열 수 없습니다.'); return; }
  showMsg(null);
  it.bad = false; it.el.classList.remove('bad'); it.viewed = true;
  app.img = { w: bmp.width, h: bmp.height, scaledDown: !!bmp.scaledDown, it };
  lutDirty = true;
  fit(); info();
  frame();
  const keep = new Set([it.key]);
  [1, -1].forEach(d => { const n = app.items[i + d]; if (n && !lowMem) { keep.add(n.key); getBitmap(n); } });
  trimCache(keep);
}
function go(d) {
  if (!app.items.length) return;
  const i = app.cur < 0 ? 0 : Math.max(0, Math.min(app.items.length - 1, app.cur + d));
  if (i !== app.cur) select(i);
}

$('pickBtn').addEventListener('click', () => pick.click());
$('add').addEventListener('click', () => pick.click());
$('clear').addEventListener('click', clearList);
zoomBtn.addEventListener('click', () => toggleFit100(app.cw / 2, app.ch / 2));
pick.addEventListener('change', () => { const f = Array.from(pick.files || []); pick.value = ''; if (f.length) addFiles(f); });

// 끌어다 놓기(창 어디에 놓아도 됨, 폴더도)
let dragTimer = 0;
const hasFiles = e => { const t = e.dataTransfer && e.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0; };
window.addEventListener('dragenter', e => { if (hasFiles(e)) { e.preventDefault(); clearTimeout(dragTimer); dropEl.classList.add('on'); } });
window.addEventListener('dragover', e => { e.preventDefault(); if (hasFiles(e)) { e.dataTransfer.dropEffect = 'copy'; clearTimeout(dragTimer); dropEl.classList.add('on'); } });
window.addEventListener('dragleave', () => { clearTimeout(dragTimer); dragTimer = setTimeout(() => dropEl.classList.remove('on'), 150); });
window.addEventListener('drop', e => {
  e.preventDefault();
  clearTimeout(dragTimer); dropEl.classList.remove('on');
  const dt = e.dataTransfer;
  if (!dt) return;
  const entries = [];
  if (dt.items) for (let i = 0; i < dt.items.length; i++) {
    const item = dt.items[i];
    if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') { const en = item.webkitGetAsEntry(); if (en) entries.push(en); }
  }
  if (entries.length) collect(entries).then(addFiles);
  else if (dt.files && dt.files.length) addFiles(Array.from(dt.files));
});
const fileOf = en => new Promise(res => en.file(res, () => res(null)));
const readAll = rd => new Promise(res => rd.readEntries(res, () => res([])));
async function collect(entries) {
  const out = [];
  for (const en of entries) {
    if (en.isFile) out.push(await fileOf(en));
    else if (en.isDirectory) {
      const rd = en.createReader();
      for (;;) { const batch = await readAll(rd); if (!batch.length) break; for (const c of batch) if (c.isFile) out.push(await fileOf(c)); }
    }
  }
  return out.filter(Boolean);
}

// 키
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' && e.target.type !== 'range') return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'PageUp') { go(-1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'PageDown') { go(1); e.preventDefault(); }
  else if (k === 'Home') { go(-app.items.length); e.preventDefault(); }
  else if (k === 'End') { go(app.items.length); e.preventDefault(); }
  else if (k === ' ' || k === 'Spacebar') { if (!e.repeat) setOriginal(true); e.preventDefault(); }
  else if ((k === 'o' || k === 'O') && (e.ctrlKey || e.metaKey)) { pick.click(); e.preventDefault(); }
  else if (k === '0' || k === 'Escape') { fit(); }
  else if (k === '1') { zoomTo(1, app.cw / 2, app.ch / 2); }
  else if (k === '+' || k === '=') { zoomTo(app.scale * 1.25, app.cw / 2, app.ch / 2); }
  else if (k === '-' || k === '_') { zoomTo(app.scale * 0.8, app.cw / 2, app.ch / 2); }
});
window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Spacebar') setOriginal(false); });

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); showMsg('화면을 다시 준비하는 중…'); });
canvas.addEventListener('webglcontextrestored', () => { try { R = new GLR(canvas); } catch (x) { } showMsg(null); if (app.cur >= 0) select(app.cur); });

sizeCanvas();

// 시험용(화면에는 영향 없음)
window.__pb = {
  version: VERSION, renderer: () => R.name, app, buildLut,
  set: (b, c, l) => { tB.set(b, true); tC.set(c, true); tL.set(l, true); frame(); },
  read: () => { frame(); return R.read(); },
  zoom: (s) => { zoomTo(s, app.cw / 2, app.ch / 2); frame(); }
};
})();
</script>
</body>
</html>
