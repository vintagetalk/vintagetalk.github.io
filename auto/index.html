<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f1f1f">
<title>빈티지 작업실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%232E2E2E'/%3E%3Cpath d='M32 12a20 20 0 0 1 0 40z' fill='%23FFC83D'/%3E%3Cpath d='M32 12a20 20 0 0 0 0 40z' fill='%23626262'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23F3F3F3' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root { --bar:#1f1f1f; --line:#3a3a3a; --text:#f3f3f3; --sub:#a9a9a9; --accent:#ffc83d; --ink:#1c1c1c;
    --ui:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #242424; color: var(--text); font-family: var(--ui); }
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; overflow: hidden; }
  nav { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bar); border-bottom: 1px solid var(--line); }
  nav button { font: inherit; font-size: 14px; color: var(--sub); background: transparent; border: 1px solid transparent;
    border-radius: 7px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  nav button:hover { color: var(--text); background: #2c2c2c; }
  nav button[aria-selected="true"] { color: var(--ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }
  nav button:focus-visible, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav .sp { flex: 1; }
  nav a { color: var(--sub); font-size: 13px; text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; white-space: nowrap; }
  nav a:hover { color: var(--text); border-color: #5a5a5a; }
  nav a[hidden] { display: none; }
  nav button.setbtn { border-color: var(--line); font-size: 13px; padding: 6px 12px; }
  .panes { position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #pBright { background: #242424; }
  iframe[hidden] { display: none; }
  /* 비밀번호 문(11/23) — 위탁 정산 = 사장, 디자인 편집기 = 사장 · 직원 */
  .pwgate { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 20px; background: #242424; }
  .pwgate[hidden] { display: none; }
  .pwbox { width: 100%; max-width: 360px; background: #2c2c2c; border: 1px solid var(--line); border-radius: 16px; padding: 24px 24px 18px; color: var(--text); }
  .pwbox h2 { margin: 0 0 4px; font-size: 20px; }
  .pwbox p { margin: 0 0 14px; color: var(--sub); font-size: 14px; line-height: 1.5; }
  .pwbox input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid #555; background: #1f1f1f; color: var(--text); margin-bottom: 12px; }
  .pwbox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pwbtns { display: flex; gap: 8px; justify-content: flex-end; }
  .pwbtns button { font: inherit; font-size: 14px; border-radius: 9px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--sub); }
  .pwbtns button[type=submit] { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .pwbtns button:disabled { opacity: .6; cursor: default; }
  .pwmsg { margin: 10px 0 0 !important; min-height: 20px; color: #ff9b8a !important; }
</style>
</head>
<body>
  <nav role="tablist" aria-label="작업 고르기">
    <button role="tab" id="tBright" aria-controls="pBright" aria-selected="true">사진 밝기 조절</button>
    <button role="tab" id="tAuto" aria-controls="pAuto" aria-selected="false">쇼핑몰 자동화</button>
    <button role="tab" id="tFilter" aria-controls="pFilter" aria-selected="false">필터 통계</button>
    <button role="tab" id="tSale" aria-controls="pSale" aria-selected="false">세일 관리</button>
    <button role="tab" id="tConsign" aria-controls="pConsign" aria-selected="false">위탁 정산</button>
    <button role="tab" id="tSales" aria-controls="pSales" aria-selected="false">매출 통계</button>
    <button role="tab" id="tDesign" aria-controls="pDesign" aria-selected="false">디자인 편집기</button>
    <span class="sp"></span>
    <a id="admin" href="#" target="_blank" rel="noopener" hidden>새 탭에서 열기</a>
    <button role="tab" id="tSet" aria-controls="pSet" aria-selected="false" class="setbtn" title="연결 · 로그인 · 알림 · 비밀번호(사장님만)">⚙ 설정</button>
  </nav>
  <div class="panes">
    <iframe id="pBright" role="tabpanel" aria-labelledby="tBright" title="사진 밝기 조절" src="brightness.html" allow="clipboard-read; clipboard-write"></iframe>
    <iframe id="pAuto" role="tabpanel" aria-labelledby="tAuto" title="쇼핑몰 자동화" hidden allow="clipboard-write"></iframe>
    <iframe id="pPick" role="tabpanel" aria-labelledby="tAuto" title="찾는 목록" hidden></iframe><!-- 11/24 사장님: 위 '배송관리' 탭은 뺌, 쇼핑몰 자동화의 [찾는 목록] 단추로만 이 화면으로 바뀜 -->
    <iframe id="pFilter" role="tabpanel" aria-labelledby="tFilter" title="필터 통계" hidden allow="clipboard-write"></iframe>
    <iframe id="pSale" role="tabpanel" aria-labelledby="tSale" title="세일 관리" hidden allow="clipboard-write"></iframe>
    <iframe id="pConsign" role="tabpanel" aria-labelledby="tConsign" title="위탁 정산" hidden allow="clipboard-write"></iframe>
    <iframe id="pSales" role="tabpanel" aria-labelledby="tSales" title="매출 통계" hidden allow="clipboard-write"></iframe><!-- 11/24 사장님: 매출 통계는 사장 비밀번호로만(직원은 못 들어감) -->
    <iframe id="pDesign" role="tabpanel" aria-labelledby="tDesign" title="디자인 편집기" hidden allow="clipboard-read; clipboard-write"></iframe>
    <iframe id="pSet" role="tabpanel" aria-labelledby="tSet" title="설정" hidden allow="clipboard-write"></iframe>
    <div class="pwgate" id="pwGate" hidden>
      <form class="pwbox" id="pwForm" autocomplete="off">
        <h2 id="pwTitle">위탁 정산</h2>
        <p id="pwSub">사장 비밀번호를 넣어 주세요.</p>
        <input type="password" id="pwIn" autocomplete="current-password" aria-label="비밀번호" required>
        <div class="pwbtns"><button type="button" id="pwCancel">다른 탭으로</button><button type="submit" id="pwOk">들어가기</button></div>
        <p class="pwmsg" id="pwMsg" aria-live="polite"></p>
      </form>
    </div>
  </div>
  <script>
  (function () {
    var exec = 'https:' + '//script.google.com/macros/s/AKfycby66qcbuyVKL0YjL21isQXYAe1yDkkSvnC5s59N7GGKDnTcVqIcs2xHwIenG7NlDbydPg/exec';
    var editor = 'editor.html';   // 빈티지톡 디자인 편집기(11/23 작업실 안으로 옮김 — 같은 폴더 editor.html)
    var tabs = { bright: ['tBright', 'pBright'], auto: ['tAuto', 'pAuto'], pick: ['tPick', 'pPick'], filter: ['tFilter', 'pFilter'], sale: ['tSale', 'pSale'], consign: ['tConsign', 'pConsign'], sales: ['tSales', 'pSales'], design: ['tDesign', 'pDesign'], settings: ['tSet', 'pSet'] };
    var srcs = { auto: exec, pick: exec + '?page=pick&set=both', filter: exec + '?page=filter', sale: exec + '?page=sale', consign: exec + '?page=consign', sales: exec + '?page=sales', design: 'editor.html', settings: exec + '?page=settings' };   // 배송관리 탭은 '톡·플오 이어서'로 시작, 필터 통계·세일 관리는 큰 화면
    var admin = document.getElementById('admin');
    admin.href = exec;   // 사장님 설정은 자동화 화면에 합쳐짐 — 바깥 창에서 열면 사장님 계정이 확실히 잡힘
    // 비밀번호 문(11/23 밤 사장님): 사진 밝기 조절 = 없음 · 쇼핑몰 자동화 · 배송관리 = 사장 또는 직원 · 나머지(필터 통계 · 세일 관리 · 위탁 정산 · 디자인 편집기) = 사장만.
    // 한 번 넣으면 이 창을 닫을 때까지 계속(sessionStorage + 50분마다 서버 입장표 늘리기). 확인은 웹앱 서버(doPost pw_login), 위탁 정산은 서버가 입장표를 다시 확인함.
    var NEED = { auto: 'any', pick: 'any', filter: 'owner', sale: 'owner', consign: 'owner', sales: 'owner', design: 'owner', settings: 'owner' }, CUR = 'bright';   // 11/24 설정(연결 · 로그인 · 알림 · 비밀번호) = 사장만
    var TITLE = { auto: '쇼핑몰 자동화', pick: '배송관리', filter: '필터 통계', sale: '세일 관리', consign: '위탁 정산', sales: '매출 통계', design: '디자인 편집기', settings: '설정' };
    var gate = document.getElementById('pwGate'), pwIn = document.getElementById('pwIn'), pwMsg = document.getElementById('pwMsg'), pwOk = document.getElementById('pwOk');
    function sess() { try { var s = JSON.parse(sessionStorage.getItem('autoPw') || 'null'); return s && s.token ? s : null; } catch (e) { return null; } }
    function pass(need) { var s = sess(); if (!s) return null; if (need === 'owner' && s.role !== 'owner') return null; return s; }
    function askPw(name) {
      var s = sess();
      document.getElementById('pwTitle').textContent = TITLE[name] || '';
      document.getElementById('pwSub').textContent = NEED[name] === 'owner' ? (s && s.role === 'staff' ? '여기는 사장 비밀번호로만 들어가요.' : '사장 비밀번호를 넣어 주세요.') : '사장 또는 직원 비밀번호를 넣어 주세요.';
      pwMsg.textContent = ''; pwIn.value = ''; gate.hidden = false;
      setTimeout(function () { try { pwIn.focus(); } catch (e) {} }, 30);
    }
    setInterval(function () {   // 창이 열려 있는 동안 입장표가 끊기지 않게
      var s = sess(); if (!s) return;
      fetch(exec, { method: 'POST', body: JSON.stringify({ api: 'pw_ping', token: s.token }) }).then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.ok === false) { try { sessionStorage.removeItem('autoPw'); } catch (x) {} } }).catch(function () {});
    }, 50 * 60 * 1000);
    document.getElementById('pwForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = CUR, need = NEED[name], pw = pwIn.value; if (!need || !pw) return;
      pwOk.disabled = true; pwMsg.textContent = '확인 중…';
      fetch(exec, { method: 'POST', body: JSON.stringify({ api: 'pw_login', pw: pw, need: need }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          pwOk.disabled = false; pwIn.value = '';
          if (!j || !j.ok || !j.r) { pwMsg.textContent = (j && j.msg) || '비밀번호가 맞지 않아요.'; pwIn.focus(); return; }
          if (need === 'owner' && j.r.role !== 'owner') { pwMsg.textContent = '여기는 사장 비밀번호로만 들어가요.'; pwIn.focus(); return; }
          try { sessionStorage.setItem('autoPw', JSON.stringify({ token: j.r.token, role: j.r.role })); } catch (x) {}
          gate.hidden = true; show(name);
        })
        .catch(function () { pwOk.disabled = false; pwMsg.textContent = '확인을 못 했어요. 인터넷을 확인하고 다시 눌러 주세요.'; });
    });
    document.getElementById('pwCancel').onclick = function () { gate.hidden = true; show('bright'); };
    function show(name) {
      CUR = name;
      var locked = NEED[name] && !pass(NEED[name]);
      Object.keys(tabs).forEach(function (k) {
        var on = k === name, tb = document.getElementById(tabs[k][0]);
        if (tb) tb.setAttribute('aria-selected', (on || (name === 'pick' && k === 'auto')) ? 'true' : 'false');   // 찾는 목록은 탭이 없어서 '쇼핑몰 자동화'에 불 켬
        document.getElementById(tabs[k][1]).hidden = !on || locked;
      });
      gate.hidden = true;
      var fr = document.getElementById(tabs[name][1]);
      if (locked) { askPw(name); admin.hidden = true; }
      else {
        var withTok = function (u) { return u + '&t=' + encodeURIComponent(pass('owner').token); };   // 사장 입장표를 서버가 다시 확인(위탁 정산 · 설정)
        // 11/24 밤: 웹앱 화면은 모두 입장표를 같이 줌(위탁 정산 · 설정 · 매출 통계는 서버가 사장인지 다시 확인, 나머지는 [텔레그램으로 보내기] 저장 때 확인)
        var ps0 = pass('any'), tokUrl = function (u) { return ps0 && u.indexOf(exec) === 0 ? u + (u.indexOf('?') < 0 ? '?' : '&') + 't=' + encodeURIComponent(ps0.token) : u; };
        if (srcs[name] && !fr.getAttribute('src')) fr.src = tokUrl(srcs[name]);
        admin.hidden = name !== 'auto' && name !== 'design' && name !== 'settings'; admin.href = name === 'design' ? editor : name === 'settings' ? withTok(srcs.settings) : exec;   // 넓게 쓰고 싶으면 새 탭
        try { fr.focus(); } catch (e) {}
      }
      var h = name === 'bright' ? '' : '#' + name;
      if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
    }
    document.getElementById('tBright').onclick = function () { show('bright'); };
    document.getElementById('tAuto').onclick = function () { show('auto'); };
    // 11/24: 쇼핑몰 자동화 화면의 [찾는 목록] 단추가 보내는 신호 → 이 창 안에서 찾는 목록 화면으로 바꿈(매번 새로 읽음)
    window.addEventListener('message', function (e) {
      var d = e.data || {}; if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
      if (d.vt === 'saleMall' && /^(oldmarket|k2sun2000|korshin7)$/.test(d.mall)) {   // 11/25: 세일 관리에서 가게를 고르면 그 가게 화면으로
        var so = pass('owner'); if (!so) return; document.getElementById('pSale').src = exec + '?page=sale&mall=' + d.mall + '&t=' + encodeURIComponent(so.token) + '&v=' + Date.now(); return;
      }
      if (d.vt !== 'showPick') return;
      var set = /^(both|talk|plusok)$/.test(d.set) ? d.set : 'both', fr = document.getElementById('pPick');
      var ps = pass('any');   // 11/24: 배송준비중으로 옮기려면 서버가 입장표(사장 또는 직원)를 확인함
      fr.src = exec + '?page=pick&set=' + set + (ps ? '&t=' + encodeURIComponent(ps.token) : '') + (d.move ? '&move=1' : '') + '&v=' + Date.now(); show('pick');
    });
    document.getElementById('tFilter').onclick = function () { show('filter'); };
    document.getElementById('tSale').onclick = function () { show('sale'); };
    document.getElementById('tConsign').onclick = function () { show('consign'); };
    document.getElementById('tSales').onclick = function () { show('sales'); };
    document.getElementById('tDesign').onclick = function () { show('design'); };
    document.getElementById('tSet').onclick = function () { show('settings'); };
    var start = location.hash.slice(1);
    show(tabs[start] ? start : 'bright');
  })();
  </script>
</body>
</html>
